name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Inventory tests
        run: python -I skills/appsec-review/method/test_inventory.py
      - name: Ledger tests
        run: python -I skills/appsec-review/method/test_ledger.py
      - name: Accepted risks tests
        run: python -I skills/appsec-review/method/test_accepted_risks.py
      - name: SARIF tests
        run: python -I skills/appsec-review/method/test_sarif.py
      - name: Threat model tests
        run: python -I skills/appsec-review/method/test_threat_model.py
      - name: Run stats tests
        run: python -I skills/appsec-review/method/test_run_stats.py
      - name: Parallel mode tests
        run: python -I skills/appsec-review/method/test_parallel_mode.py
      - name: Install link tests
        run: python -I skills/appsec-review/method/test_install_links.py
      - name: Layout tests
        run: python -I skills/appsec-review/method/test_layout.py
      - name: Benchmark tests
        run: python -I skills/appsec-review/evals/test_benchmark.py
      - name: CVSS calculator selftest
        run: python -I skills/appsec-review/report/cvss40.py --selftest
      - name: CVSS calculator tests
        run: python -I skills/appsec-review/report/test_cvss40.py
      - name: Logo embedding tests
        run: python -I skills/appsec-review/report/test_embed_logos.py
      - name: Sample report tests
        run: python -I skills/appsec-review/report/test_build_sample.py
